name: tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so an advisory published against a pinned dependency is seen
    # even when nobody pushes.
    - cron: '17 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The Python openclaw-vps serves with. CI is the review gate, so it
          # tests that version; move this in the same change as the box.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements.lock

      - name: Run tests
        run: pytest -v

      - name: Audit the service's dependencies
        run: pip-audit -r requirements.lock
